<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.5 13 13" width="16" height="16">
  <title>Tableside</title>
  <!-- Notification glyph: the micro mark (tableside-icon-micro.svg) without its tile, white on transparent, filling Android's 22/24 dp live area. Android draws notification icons from transparency alone, so a filled tile would show as a blank square. -->
  <g id="mark" fill="#FFFFFF">
    <ellipse id="tabletop" cx="8" cy="5.5" rx="6" ry="2"/>
    <path id="pedestal-tail" d="M6.5 6.5 H9.75 L8 11.5 H6.5 Z"/>
    <rect id="foot" x="5" y="11" width="6" height="1.5" rx="0.75"/>
  </g>
</svg>
