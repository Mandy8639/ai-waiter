<svg xmlns="http://www.w3.org/2000/svg" viewBox="186 244 652 562" width="652" height="562">
  <title>Tableside</title>
  <!-- Standalone mark, monochrome white. -->
  <g id="mark" fill="#FFFFFF">
    <!-- Top surface of a round table, seen from slightly above. -->
    <ellipse id="tabletop" cx="512" cy="356" rx="306" ry="92"/>
    <!-- Its edge, separated by a gap, so the top reads as a table disc. -->
    <path id="tabletop-edge" d="M206 370 A306 92 0 0 0 818 370 V388 A306 92 0 0 1 206 388 Z"/>
    <!-- The pedestal, curved like a speech-bubble tail: the conversation. -->
    <path id="pedestal-tail" d="M428 462 H676 Q548 540 502 748 H428 Z"/>
    <!-- The foot, centred, so the whole reads as a table first. -->
    <ellipse id="foot" cx="512" cy="752" rx="152" ry="34"/>
  </g>
</svg>
