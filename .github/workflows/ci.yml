name: CI

# Runs the same five checks documented in
# docs/development.md#before-opening-a-pr, on every push.
#
# Runs on pull requests, and on pushes to main so a merge straight to main is
# still checked. Not on pushes to every branch as well: a PR branch would then
# run twice per push (push + pull_request), doubling the Actions minutes this
# private repo's free allowance covers. Minutes ran out on 2026-10-26.
#
# No secrets are required, by design:
#   - The test suite builds its own throwaway Postgres per test file
#     (PGlite/WASM, see tests/integration/db/setup.ts) and never touches a real
#     Supabase project. Verified: all tests pass with no env file present.
#   - The build only needs the two NEXT_PUBLIC_* variables to exist and be
#     well-formed, because src/lib/env.ts validates them at module load and
#     throws otherwise. The placeholder values below are deliberately fake —
#     CI never connects to a real project, and these are public-safe anyway.
#
# Deliberately NOT run here: `npm run test:e2e`. Those specs need real Supabase
# credentials and browser downloads; see
# docs/development.md#running-the-full-e2e-flow-against-a-real-supabase-project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every check below runs even when an earlier one fails, so a single run
      # reports all the problems at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
